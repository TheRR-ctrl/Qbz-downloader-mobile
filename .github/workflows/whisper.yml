name: Compilar Whisper para Android
# Compila whisper.cpp + el puente JNI (lyrics/src/main/cpp) para arm64 y deja libqlwhisper.so en lyrics/src/main/jniLibs.
# El modelo (ggml-base-q5_1.bin, ~60 MB, de ggerganov/whisper.cpp en Hugging Face) va en lyrics/src/main/assets y no se sube al repo:
# quien compile el APK lo baja con la orden de lyrics/src/main/assets/LEEME.txt.
on:
  workflow_dispatch:
  push:
    branches: [ccr-35e500fb-x8va01-sugerencias-ia]
    paths: ['lyrics/src/main/cpp/**', '.github/workflows/whisper.yml']
permissions:
  contents: write
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traer whisper.cpp
        run: git clone --depth 1 --branch v1.7.4 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
      - name: Compilar
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S lyrics/src/main/cpp -B build-whisper \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DWHISPER_DIR=/tmp/whisper.cpp
          cmake --build build-whisper -j4
          mkdir -p lyrics/src/main/jniLibs/arm64-v8a
          cp build-whisper/libqlwhisper.so lyrics/src/main/jniLibs/arm64-v8a/
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" lyrics/src/main/jniLibs/arm64-v8a/libqlwhisper.so
          ls -l lyrics/src/main/jniLibs/arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: libqlwhisper
          path: lyrics/src/main/jniLibs/arm64-v8a/libqlwhisper.so
          retention-days: 7
        continue-on-error: true
      - name: Guardar la librería en el repo
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f lyrics/src/main/jniLibs/arm64-v8a/libqlwhisper.so
          git diff --cached --quiet || (git commit -m "libqlwhisper.so compilada por Actions" && git pull --rebase -q && git push -q)
